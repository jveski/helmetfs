SPECIFICATION Spec

\* Model values
CONSTANTS
    Writers = {w1, w2}

\* Symmetry reduction: writers are interchangeable
SYMMETRY WriterSymmetry

\* Bound counters to make the state space finite
CONSTRAINT StateConstraint

\* Safety invariants to check
INVARIANT TypeOK
INVARIANT GenMonotonic
INVARIANT RefcountNonNeg
INVARIANT RefcountAccurate
\* This is the KEY property: no write is silently lost from replication
INVARIANT NoSilentWriteLoss

\* Liveness (requires SPECIFICATION FairSpec instead)
\* PROPERTY EventuallyClean
\* PROPERTY EventuallyReplicated
