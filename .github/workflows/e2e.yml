name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config

      - name: Enable FUSE for unprivileged users
        run: |
          # Allow non-root users to mount FUSE filesystems
          sudo sed -i 's/#user_allow_other/user_allow_other/' /etc/fuse.conf
          # Load the FUSE kernel module
          sudo modprobe fuse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build helmetfs
        run: cargo build

      - name: Run E2E tests
        run: |
          tests/e2e.sh
